      <noscript>
        <div class="noscript">
          <h1>Mercado Guaicaipuro</h1>
          <p>Tus compras del día, más fáciles y a tu alcance.</p>
          <p>
            Estamos en el Mercado Municipal de Guaicaipuro, Caracas,
            Venezuela. Ofrecemos productos de la cesta básica, combos,
            delivery sujeto a cobertura y retiro en el mercado.
          </p>
          <p>
            Combos de demostración: Básico, Familiar, Rendidor, Desayuno y

          </p>
          <p>
            Horario: lunes a viernes de 8:00 a. m. a 8:00 p. m. y sábados de

            redes sociales: por confirmar.
          </p>
          <p>

            oficial está por confirmar.
          </p>
