<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sel:#0b3b2a;--sel2:#1b6b3c;--lima:#9bc53d;--aji:#f0a30a;--fondo:#f1f4ee;--tx:#1d2a22;--suave:#66736b;--linea:#dde4da}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--fondo);color:var(--tx);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:'Fraunces',Georgia,serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--aji);outline-offset:2px}
.hero{position:relative;overflow:hidden;color:#fff;min-height:290px;padding:calc(48px + env(safe-area-inset-top,0px)) 24px 70px;border-radius:0 0 40px 40px;background:radial-gradient(ellipse at 50% -10%,#3f9a4f 0,#1b6b3c 38%,#0b3b2a 78%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.sa{transform-origin:0 0;animation:sw 7s ease-in-out infinite alternate}
.sb{transform-origin:400px 0;animation:sw 8s ease-in-out infinite alternate-reverse}
@keyframes sw{to{transform:rotate(3deg)}}
.hero .tx{position:relative;max-width:1100px;margin:auto;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hero small{display:block;font-weight:500;letter-spacing:.04em;color:#d5ecc0;margin-bottom:8px}
.hero h1{font-size:clamp(2.4rem,10vw,4.4rem);font-weight:800;line-height:1;max-width:11ch}
.hero p{margin-top:12px;max-width:34ch;color:#e7f3dc}
.mesa{display:inline-block;margin-top:18px;background:var(--aji);color:#2a1b00;font-weight:700;border-radius:99px;padding:7px 16px;text-shadow:none}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:14px 16px;margin-top:-28px;scrollbar-width:none;max-width:1100px;margin-inline:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:#fff;border:1.5px solid var(--linea);border-radius:99px;padding:10px 20px;font-weight:600;box-shadow:0 4px 12px rgba(11,59,42,.12);transition:background .25s,color .25s,transform .15s}
.tab:active{transform:scale(.95)}
.tab[aria-selected=true]{background:var(--sel);color:#fff;border-color:var(--sel)}
main{display:grid;gap:22px;padding:12px 16px;max-width:1100px;margin:auto;grid-template-columns:1fr}
@media(min-width:680px){main{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){main{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 4px 18px rgba(11,59,42,.1);display:flex;flex-direction:column;animation:entra .45s ease both;transition:transform .25s,box-shadow .25s}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,59,42,.18)}}
@keyframes entra{from{opacity:0;transform:translateY(14px)}}
.open{display:block;width:100%;text-align:left}
.foto{position:relative;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;font-size:4rem;background:linear-gradient(135deg,var(--c1),var(--c2))}
.foto::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 55%)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){.card:hover .foto img{transform:scale(1.06)}}
.cat{position:absolute;left:12px;top:12px;background:rgba(11,59,42,.78);color:#fff;font-size:.78rem;font-weight:500;padding:4px 11px;border-radius:99px;backdrop-filter:blur(4px)}
.pr{position:absolute;right:12px;bottom:12px;background:#fff;color:var(--sel);font-weight:800;border-radius:12px;padding:5px 12px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.cuerpo{padding:16px 18px 18px;display:grid;gap:6px}
.card h3{font-size:1.25rem;font-weight:800;padding-right:50px}
.desc{color:var(--suave);font-size:.93rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.enC{font-size:.82rem;font-weight:700;color:var(--sel2);min-height:1.1em}
.mas{position:absolute;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;background:var(--aji);color:#2a1b00;font-size:1.5rem;font-weight:700;box-shadow:0 4px 12px rgba(240,163,10,.5);transition:transform .15s}
.mas:active{transform:scale(.86)}
.bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;max-width:1072px;margin:auto;background:var(--sel);color:#fff;border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;font-weight:700;box-shadow:0 10px 28px rgba(11,59,42,.45);transform:translateY(150%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.bar.on{transform:none}
.bar.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.04)}}
.scrim{position:fixed;inset:0;background:rgba(5,25,17,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:640px;margin:auto;max-height:92dvh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1),visibility 0s .38s;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.sheet .foto{border-radius:26px 26px 0 0;aspect-ratio:16/10}
.in{padding:18px 20px;display:grid;gap:14px}
.in h2{font-size:1.6rem;font-weight:800}
.cerrar{position:absolute;top:12px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);font-size:1.1rem;font-weight:700}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--fondo);font-size:1.3rem;font-weight:700;transition:transform .15s,background .2s}
.step button:active{transform:scale(.88);background:var(--aji)}
.step span{min-width:26px;text-align:center;font-weight:700;font-size:1.1rem}
.cta{background:var(--aji);color:#2a1b00;font-weight:800;border-radius:14px;padding:15px;width:100%;font-size:1rem;transition:transform .15s,opacity .2s}
.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.55}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.item b{display:block}
.item small{color:var(--suave)}
label{display:grid;gap:5px;font-size:.88rem;font-weight:500;color:var(--suave)}
input,textarea{font:inherit;color:var(--tx);border:1.5px solid var(--linea);border-radius:12px;padding:11px 13px;width:100%;background:#fff}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:800}
.ok{text-align:center;padding:34px 20px;display:grid;gap:12px;justify-items:center}
.check{width:76px;height:76px;border-radius:50%;background:var(--sel2);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.check svg{width:38px;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:trazo .45s .25s forwards}
@keyframes pop{from{transform:scale(0)}}
@keyframes trazo{to{stroke-dashoffset:0}}
.err{color:#b3261e;font-size:.9rem;font-weight:500}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><g id="lf"><path d="M0 0C28-26 78-30 120 0C78 24 28 20 0 0Z"/><path d="M0 0L112 0" stroke="#fff" stroke-opacity=".16" stroke-width="1.5" fill="none"/></g></defs>
    <g class="sa">
      <use href="#lf" transform="rotate(8) scale(1.9)" fill="#0a3022"/><use href="#lf" transform="rotate(28) scale(1.7)" fill="#14532d"/>
      <use href="#lf" transform="rotate(48) scale(1.5)" fill="#1f6b3a"/><use href="#lf" transform="rotate(68) scale(1.3)" fill="#2f8a42"/>
      <use href="#lf" transform="rotate(86) scale(1.1)" fill="#0f4a2d"/><use href="#lf" transform="translate(0 150) rotate(-12) scale(1.2)" fill="#0a3022" opacity=".8"/>
    </g>
    <g class="sb">
      <use href="#lf" transform="translate(400 0) rotate(172) scale(1.9)" fill="#0a3022"/><use href="#lf" transform="translate(400 0) rotate(152) scale(1.7)" fill="#14532d"/>
      <use href="#lf" transform="translate(400 0) rotate(132) scale(1.5)" fill="#1f6b3a"/><use href="#lf" transform="translate(400 0) rotate(112) scale(1.3)" fill="#2f8a42"/>
      <use href="#lf" transform="translate(400 0) rotate(94) scale(1.1)" fill="#0f4a2d"/><use href="#lf" transform="translate(400 170) rotate(192) scale(1.2)" fill="#0a3022" opacity=".8"/>
    </g>
  </svg>
  <div class="tx"><small id="nom"></small><h1>Sabores de la Selva</h1><p>Cocina amazónica con ají charapita, plátano, yuca y pescado de río.</p><span class="mesa" id="mesaTxt"></span></div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Categorías"></nav>
<main id="lista"></main>

<button class="bar" id="bar" aria-label="Ver mi pedido"><span id="barN"></span><span id="barT"></span></button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="det" role="dialog" aria-modal="true"></section>
<section class="sheet" id="cart" role="dialog" aria-modal="true" aria-label="Mi pedido"></section>

<script>
/* ===== CONFIGURA AQUÍ ===== */
const CONFIG = {
  restaurante: "Mi Restaurante",
  moneda: "S/",
  scriptUrl: "" // URL de tu Apps Script (termina en /exec)
};
/* FOTOS: pega en "foto" la URL de la imagen (ej. Unsplash: https://images.unsplash.com/photo-XXXX?auto=format&fit=crop&w=800&q=75)
   o una ruta propia (fotos/juane.jpg). Si está vacío se muestra el color con el ícono. */
const PLATOS = [
 {id:1,cat:"Fondos",nombre:"Juane de gallina",precio:28,emoji:"🍃",c:["#2f8a42","#9bc53d"],foto:"",desc:"Arroz sazonado con culantro, cúrcuma y especias, con presa de gallina, huevo cocido y aceituna, todo envuelto en hoja de bijao."},
 {id:2,cat:"Fondos",nombre:"Tacacho con cecina",precio:30,emoji:"🍌",c:["#c9831a","#f0c24b"],foto:"",desc:"Bolas de plátano verde asado y machacado con manteca, acompañadas de cecina de cerdo ahumada y chorizo regional."},
 {id:3,cat:"Fondos",nombre:"Patarashca de pescado",precio:34,emoji:"🐟",c:["#14532d","#4fa05a"],foto:"",desc:"Pescado de río marinado con ají charapita y sacha culantro, cocido a la brasa en hoja de bijao. Con yuca sancochada."},
 {id:4,cat:"Sopas",nombre:"Inchicapi",precio:22,emoji:"🍲",c:["#b8741a","#e8b04a"],foto:"",desc:"Sopa espesa de gallina con maní molido, maíz y culantro. Se sirve caliente con yuca."},
 {id:5,cat:"Entradas",nombre:"Ceviche de paiche",precio:38,emoji:"🍋",c:["#2c7a5b","#8fd0a6"],foto:"",desc:"Paiche fresco marinado en limón con ají charapita y cebolla roja. Acompañado de yuca y plátano frito."},
 {id:6,cat:"Entradas",nombre:"Ensalada de chonta",precio:20,emoji:"🥗",c:["#5a8f2e","#c5e07a"],foto:"",desc:"Palmito de chonta en rodajas con tomate, cebolla, limón y aceite de oliva. Fresca y ligera."},
 {id:7,cat:"Sopas",nombre:"Timbuche",precio:24,emoji:"🥣",c:["#a5561f","#e29a55"],foto:"",desc:"Caldo de pescado de río con ají charapita, culantro y cebolla china. Se sirve con yuca y plátano."},
 {id:8,cat:"Fondos",nombre:"Paiche a la plancha",precio:42,emoji:"🔥",c:["#0f4a2d","#3f9a4f"],foto:"",desc:"Filete de paiche dorado a la plancha con yuca frita, ensalada fresca y salsa criolla amazónica."},
 {id:9,cat:"Dulce y bebida",nombre:"Helado de aguaje",precio:12,emoji:"🍨",c:["#d98e04","#f6d55c"],foto:"",desc:"Helado cremoso del fruto del aguaje, dulce y ligeramente ácido, servido en copa."},
 {id:10,cat:"Dulce y bebida",nombre:"Refresco de camu camu",precio:10,emoji:"🍹",c:["#a31f2b","#e8604c"],foto:"",desc:"Bebida fría del fruto amazónico camu camu, muy rico en vitamina C. Servida con hielo."}
];
/* ========================= */
const $=s=>document.querySelector(s), money=n=>CONFIG.moneda+" "+n.toFixed(2);
const mesa=(new URLSearchParams(location.search).get("mesa")||"").slice(0,10);
const CATS=["Todos",...new Set(PLATOS.map(p=>p.cat))];
let cat="Todos",cart={},tmp=1,current=null,cur=0,sending=false;

document.title=CONFIG.restaurante+" · Menú";
$("#nom").textContent=CONFIG.restaurante;
$("#mesaTxt").textContent=mesa?"Mesa "+mesa:"Menú digital";

const foto=p=>`<div class="foto" style="--c1:${p.c[0]};--c2:${p.c[1]}"><span aria-hidden="true">${p.emoji}</span>${p.foto?`<img src="${p.foto}" alt="${p.nombre}" loading="lazy" onerror="this.remove()">`:""}`;
function renderTabs(){$("#tabs").innerHTML=CATS.map(c=>`<button class="tab" role="tab" aria-selected="${c===cat}" data-cat="${c}">${c}</button>`).join("")}
function renderLista(){
  $("#lista").innerHTML=PLATOS.filter(p=>cat==="Todos"||p.cat===cat).map((p,i)=>`
   <article class="card" style="animation-delay:${i*45}ms">
    <button class="open" data-id="${p.id}" aria-label="Ver ${p.nombre}">${foto(p)}<span class="cat">${p.cat}</span><span class="pr">${money(p.precio)}</span></div>
     <div class="cuerpo"><h3>${p.nombre}</h3><p class="desc">${p.desc}</p><span class="enC">${cart[p.id]?"✓ "+cart[p.id]+" en tu pedido":""}</span></div></button>
    <button class="mas" data-quick="${p.id}" aria-label="Agregar ${p.nombre}">+</button></article>`).join("");
}
function totales(){let n=0,t=0;for(const id in cart){n+=cart[id];t+=cart[id]*PLATOS.find(p=>p.id==id).precio}return{n,t}}
function renderBar(bump){
  const {n,t}=totales(),b=$("#bar");
  $("#barN").textContent=n+(n===1?" plato · Ver pedido":" platos · Ver pedido");$("#barT").textContent=money(t);
  b.classList.toggle("on",n>0);
  if(bump){b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
}
const abrir=el=>{$("#scrim").classList.add("on");el.classList.add("on");current=el};
const cerrar=()=>{$("#scrim").classList.remove("on");if(current)current.classList.remove("on");current=null};

function detalle(id){
  const p=PLATOS.find(x=>x.id==id);cur=id;tmp=cart[id]||1;
  const el=$("#det");el.setAttribute("aria-label",p.nombre);
  el.innerHTML=`<button class="cerrar" data-act="cerrar" aria-label="Cerrar">✕</button>${foto(p)}</div>
   <div class="in"><h2>${p.nombre}</h2><p class="desc" style="-webkit-line-clamp:unset">${p.desc}</p>
   <div class="fila"><div class="step"><button data-act="menos" aria-label="Quitar uno">−</button><span id="q"></span><button data-act="mas" aria-label="Agregar uno">+</button></div><b id="sub" style="font-size:1.15rem"></b></div>
   <button class="cta" data-act="agregar">${cart[id]?"Actualizar pedido":"Agregar al pedido"}</button></div>`;
  sub();abrir(el);
}
function sub(){const p=PLATOS.find(x=>x.id==cur);$("#q").textContent=tmp;$("#sub").textContent=money(tmp*p.precio)}

function carrito(){
  const el=$("#cart"),{t}=totales();
  const items=Object.keys(cart).map(id=>{const p=PLATOS.find(x=>x.id==id);
   return `<div class="item"><div><b>${p.nombre}</b><small>${money(p.precio)} c/u</small></div><div class="step"><button data-act="cmenos" data-id="${id}" aria-label="Quitar uno">−</button><span>${cart[id]}</span><button data-act="cmas" data-id="${id}" aria-label="Agregar uno">+</button></div></div>`}).join("");
  el.innerHTML=`<button class="cerrar" data-act="cerrar" aria-label="Cerrar" style="background:var(--fondo)">✕</button><div class="in"><h2>Mi pedido</h2>
   ${items||'<p class="desc">Tu pedido está vacío. Elige un plato del menú.</p>'}
   ${items?`${mesa?"":'<label>Número de mesa<input id="fMesa" inputmode="numeric" maxlength="10" placeholder="Ej. 5"></label>'}
   <label>Tu nombre (opcional)<input id="fNom" maxlength="40" autocomplete="given-name"></label>
   <label>Nota para cocina (opcional)<textarea id="fNota" rows="2" maxlength="200" placeholder="Sin cebolla, ají aparte…"></textarea></label>
   <div class="total"><span>Total</span><span>${money(t)}</span></div><p class="err" id="err" role="alert"></p>
   <button class="cta" data-act="enviar">Enviar pedido a caja</button>`:""}</div>`;
  if(current!==el)abrir(el);
}
function cambiar(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderBar();renderLista();carrito()}

async function enviar(){
  if(sending)return;
  const m=mesa||($("#fMesa")?$("#fMesa").value.trim():"");
  if(!m){$("#err").textContent="Escribe tu número de mesa.";$("#fMesa").focus();return}
  const {t}=totales();
  const payload={mesa:m,cliente:$("#fNom").value.trim(),nota:$("#fNota").value.trim(),total:t,
   items:Object.keys(cart).map(id=>{const p=PLATOS.find(x=>x.id==id);return{nombre:p.nombre,cant:cart[id],precio:p.precio}})};
  sending=true;const btn=document.querySelector('[data-act="enviar"]');btn.disabled=true;btn.textContent="Enviando…";
  try{
    if(CONFIG.scriptUrl)await fetch(CONFIG.scriptUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    else{console.log("Modo prueba:",payload);await new Promise(r=>setTimeout(r,600))}
    cart={};renderBar();renderLista();
    $("#cart").innerHTML=`<div class="ok"><div class="check"><svg viewBox="0 0 40 40"><path d="M8 21l8 8 16-17"/></svg></div><h2>¡Pedido enviado!</h2><p class="desc">Mesa ${m}. Ya llegó a caja y cocina, en un momento te lo llevan.</p><button class="cta" data-act="cerrar">Seguir viendo el menú</button></div>`;
  }catch(e){$("#err").textContent="No se pudo enviar. Revisa tu internet o llama al mesero.";btn.disabled=false;btn.textContent="Enviar pedido a caja"}
  sending=false;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-cat],[data-id],[data-quick],[data-act],#bar,#scrim");
  if(!t)return;
  if(t.id==="scrim")return cerrar();
  if(t.id==="bar")return carrito();
  if(t.dataset.cat){cat=t.dataset.cat;renderTabs();return renderLista()}
  if(t.dataset.quick){const id=t.dataset.quick;cart[id]=(cart[id]||0)+1;renderBar(true);return renderLista()}
  const a=t.dataset.act,id=t.dataset.id;
  if(!a)return detalle(id);
  if(a==="cerrar")cerrar();
  else if(a==="mas"){tmp=Math.min(tmp+1,20);sub()}
  else if(a==="menos"){tmp=Math.max(tmp-1,1);sub()}
  else if(a==="agregar"){cart[cur]=tmp;renderBar(true);renderLista();cerrar()}
  else if(a==="cmas")cambiar(id,1);
  else if(a==="cmenos")cambiar(id,-1);
  else if(a==="enviar")enviar();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrar()});
renderTabs();renderLista();renderBar();
</script>
</body>
</html>
